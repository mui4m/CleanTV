name: Build CleanTV APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # v3 still uses node20 but we force run, warnings are ok
        # If fails, we install manually below

      - name: Install SDK components
        shell: pwsh
        run: |
          $env:ANDROID_HOME = "$env:LOCALAPPDATA\Android\Sdk"
          if (-not $env:ANDROID_HOME) { $env:ANDROID_HOME = "C:\Android\android-sdk" }
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          # Accept licenses
          echo y | sdkmanager --licenses 2>&1 | Out-Host
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"

      - name: Build Launcher
        shell: pwsh
        run: |
          cd launcher/app
          Write-Host "Building launcher..."
          .\gradlew.bat assembleDebug --stacktrace --info
          cd ../..

      - name: Try build updater
        shell: pwsh
        run: |
          # Build phone version if exists
          if (Test-Path "launcher/updater/gradlew.bat") {
            cd launcher/updater
            .\gradlew.bat assembleDebug --stacktrace
            cd ../..
          }
          if (Test-Path "updater/CapNhat") {
            dir updater -Recurse
          }

      - name: Find and copy APKs
        shell: pwsh
        run: |
          mkdir dist -Force | Out-Null
          $apks = Get-ChildItem -Path . -Filter *.apk -Recurse
          foreach ($apk in $apks) {
            Write-Host "Found: $($apk.FullName)"
            Copy-Item $apk.FullName dist/ -Force
          }
          Get-ChildItem dist -Recurse
          if ((Get-ChildItem dist -Filter *.apk).Count -eq 0) {
            Write-Host "No APK found, listing build outputs..."
            Get-ChildItem launcher -Recurse -Filter *.apk
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-APKs
          path: |
            dist/**/*.apk
            launcher/app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
