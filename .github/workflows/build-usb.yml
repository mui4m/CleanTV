name: Build CapNhatMayChieu APK (USB) - Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"

      - name: Build Launcher APK
        shell: pwsh
        run: |
          cd launcher/app
          .\gradlew.bat assembleDebug --stacktrace
          dir build/outputs/apk/debug -Recurse
          cd ../..

      - name: Build Updater APKs (if exists)
        shell: pwsh
        run: |
          if (Test-Path "updater") { Get-ChildItem updater -Recurse | Write-Host }
          if (Test-Path "launcher/updater") { 
            cd launcher/updater
            if (Test-Path "gradlew.bat") { .\gradlew.bat assembleDebug --stacktrace }
            cd ../..
          }
          # Try original build script but don't fail if error
          try { .\updater\build-usb.ps1 } catch { Write-Host "build-usb.ps1 failed but continue: $_" }

      - name: Collect APKs
        shell: pwsh
        run: |
          mkdir dist -Force
          Get-ChildItem -Path . -Filter *.apk -Recurse | ForEach-Object { Copy-Item $_.FullName dist/ -Force; Write-Host "Found APK: $($_.FullName)" }
          dir dist -Recurse
          dir launcher/app/build/outputs -Recurse -ErrorAction SilentlyContinue

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-APKs
          path: |
            **/*.apk
            dist/**
          if-no-files-found: warn
