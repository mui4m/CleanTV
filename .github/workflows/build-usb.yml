name: Build CleanTV APKs
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build Launcher
        shell: pwsh
        run: |
          cd launcher/app
          gradle assembleDebug --stacktrace
          cd ../..
      - name: Make USB-CapNhat folder
        shell: pwsh
        run: |
          mkdir dist/USB-CapNhat -Force
          Copy-Item launcher/app/build/outputs/apk/debug/*.apk dist/USB-CapNhat/CapNhatMayChieu.apk -Force -ErrorAction SilentlyContinue
          Copy-Item launcher/app/build/outputs/apk/debug/*.apk dist/ -Force -ErrorAction SilentlyContinue
          if (Test-Path tools/xgimi-vi) { Copy-Item tools/xgimi-vi dist/USB-CapNhat/xgimi-vi -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path examples) { Copy-Item examples dist/USB-CapNhat/examples -Recurse -Force -ErrorAction SilentlyContinue }
          dir dist -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: USB-CapNhat-Full
          path: dist/**
