name: Build USB Full - Both APKs Fixed v2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: List project structure
        shell: pwsh
        run: |
          Write-Host "=== Root ==="
          dir
          Write-Host "`n=== launcher ==="
          dir launcher -Recurse -Filter *.gradle | Format-Table FullName
          Write-Host "`n=== updater ==="
          dir updater -Recurse -Filter *.gradle | Format-Table FullName

      - name: Build Launcher
        shell: pwsh
        run: |
          cd launcher/app
          gradle assembleDebug --stacktrace
          cd ../..

      - name: Build Updater
        shell: pwsh
        run: |
          if (Test-Path updater/app/build.gradle) {
            Write-Host "Building updater/app"
            cd updater/app
            gradle assembleDebug --stacktrace
            cd ../..
          } elseif (Test-Path updater/build.gradle) {
            Write-Host "Building updater"
            cd updater
            gradle assembleDebug --stacktrace
            cd ..
          } else {
            Write-Host "Searching for gradle files in updater"
            $gradleFiles = Get-ChildItem updater -Recurse -Filter build.gradle
            foreach ($f in $gradleFiles) {
              Write-Host "Found: $($f.FullName) - building in $($f.DirectoryName)"
              Push-Location $f.DirectoryName
              gradle assembleDebug --stacktrace
              Pop-Location
            }
          }
          Write-Host "`n=== APKs found ==="
          Get-ChildItem -Recurse -Filter *.apk | Format-Table FullName, Length

      - name: Assemble USB
        shell: pwsh
        run: |
          mkdir dist/USB-CapNhat -Force
          mkdir dist/USB-CapNhat/launcher -Force

          $launcherApk = Get-ChildItem launcher/app/build/outputs/apk/debug -Filter *.apk -Recurse | Select-Object -First 1
          if ($launcherApk) {
            Copy-Item $launcherApk.FullName dist/USB-CapNhat/launcher/launcher.apk -Force
            Copy-Item $launcherApk.FullName dist/launcher.apk -Force
            Write-Host "Launcher: $($launcherApk.Length) bytes"
          }

          $updaterApk = Get-ChildItem updater -Filter *.apk -Recurse | Where-Object { $_.FullName -like "*debug*" } | Select-Object -First 1
          if (-not $updaterApk) { $updaterApk = Get-ChildItem updater -Filter *.apk -Recurse | Select-Object -First 1 }
          
          if ($updaterApk) {
            Copy-Item $updaterApk.FullName dist/USB-CapNhat/CapNhatMayChieu.apk -Force
            Copy-Item $updaterApk.FullName dist/CapNhatMayChieu.apk -Force
            Write-Host "Updater: $($updaterApk.Length) bytes - $($updaterApk.FullName)"
          } else {
            Write-Host "No updater APK found, listing all APKs:" -ForegroundColor Red
            Get-ChildItem -Filter *.apk -Recurse | Format-Table FullName, Length
          }

          if (Test-Path tools/xgimi-vi) { Copy-Item tools/xgimi-vi dist/USB-CapNhat/xgimi-vi -Recurse -Force -ErrorAction SilentlyContinue }
          
          Write-Host "`n=== Final check ==="
          $f1 = Get-Item dist/USB-CapNhat/launcher/launcher.apk -ErrorAction SilentlyContinue
          $f2 = Get-Item dist/USB-CapNhat/CapNhatMayChieu.apk -ErrorAction SilentlyContinue
          if ($f1 -and $f2) {
            Write-Host "Launcher: $($f1.Length) bytes"
            Write-Host "Updater: $($f2.Length) bytes"
            $h1 = (Get-FileHash $f1.FullName -Algorithm MD5).Hash
            $h2 = (Get-FileHash $f2.FullName -Algorithm MD5).Hash
            Write-Host "Launcher MD5: $h1"
            Write-Host "Updater MD5: $h2"
            if ($h1 -eq $h2) { Write-Host "FAIL: Giong nhau!" -ForegroundColor Red } else { Write-Host "OK: Khac nhau!" -ForegroundColor Green }
          }
          Get-ChildItem dist -Recurse | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: USB-CapNhat-Fixed
          path: dist/**
