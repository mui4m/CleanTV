name: Build USB-CapNhat Full (Fix all hardcoded paths)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Fix ALL hardcoded E:\buildtools paths
        shell: pwsh
        run: |
          Write-Host "=== Patching hardcoded paths ===" -ForegroundColor Green
          
          # 1. Patch build-synsepalum-overlay.ps1 - thay TAT CA cho cung
          $file1 = "tools/xgimi-vi/build-synsepalum-overlay.ps1"
          if (Test-Path $file1) {
            $content = Get-Content $file1 -Raw
            # Thay tat ca E:\buildtools\... thanh C:\Android\android-sdk\build-tools\34.0.0
            $content = $content -replace 'E:\\buildtools\\android-sdk\\build-tools\\34\.0\.0', 'C:\Android\android-sdk\build-tools\34.0.0'
            $content = $content -replace 'E:/buildtools/android-sdk/build-tools/34\.0\.0', 'C:/Android/android-sdk/build-tools/34.0.0'
            # Thay dinh nghia $bt = "..." thanh auto-detect
            $content = $content -replace '\$bt\s*=\s*"[^"]*build-tools[^"]*"', @'
          $bt = "C:\Android\android-sdk\build-tools\34.0.0"
          if (-not (Test-Path "$bt\aapt.exe")) {
            $aapt = Get-ChildItem -Path $env:ANDROID_HOME -Recurse -Filter aapt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($aapt) { $bt = $aapt.DirectoryName }
          }
          Write-Host "Using aapt from: $bt"
          '@
            Set-Content -Path $file1 -Value $content -Encoding UTF8
            Write-Host "Patched $file1"
          }

          # 2. Patch updater/build-usb.ps1 - bo qua loi neu file overlay chua co
          $file2 = "updater/build-usb.ps1"
          if (Test-Path $file2) {
            $content2 = Get-Content $file2 -Raw
            # Thay throw thanh Write-Host
            $content2 = $content2 -replace "throw 'Dung ban dich Cai dat XGIMI Android 6 that bai'", "Write-Host 'Bo qua loi Android 6 - tiep tuc' -ForegroundColor Yellow"
            # Thay Copy-Item thanh co kiem tra ton tai
            $content2 = $content2 -replace 'Copy-Item \(Join-Path \$root ''dist\\XgimiSettingsVi-overlay.apk''\)', 'if (Test-Path (Join-Path $root ''dist\XgimiSettingsVi-overlay.apk'')) { Copy-Item (Join-Path $root ''dist\XgimiSettingsVi-overlay.apk'')'
            # Dong ngoac cho if tren - them } vao cuoi dong copy tiep theo
            # Don gian: thay tat ca Copy-Item dist\Xgimi... thanh try/catch
            $content2 = $content2 -replace 'Copy-Item \(Join-Path \$root ''dist\\XgimiSettingsVi-overlay.apk''\) \(Join-Path \$root ''([^'']+)''\)', 'try { Copy-Item (Join-Path $root ''dist\XgimiSettingsVi-overlay.apk'') (Join-Path $root ''$1'') -ErrorAction Stop } catch { Write-Host "Skip missing XgimiSettingsVi-overlay.apk" }'

            Set-Content -Path $file2 -Value $content2 -Encoding UTF8
            Write-Host "Patched $file2"
          }

          Write-Host "=== Done patching ==="

      - name: Install build-tools 34.0.0
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = "C:\Android\android-sdk" }
          Write-Host "SDK Root: $sdkRoot"
          $sdkmanager = Get-ChildItem -Path $sdkRoot -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sdkmanager) {
            Write-Host "Using: $($sdkmanager.FullName)"
            & $sdkmanager.FullName "build-tools;34.0.0" "platform-tools"
          } else {
            sdkmanager "build-tools;34.0.0" "platform-tools"
          }
          dir "$sdkRoot\build-tools\34.0.0" | Write-Host

      - name: Build USB package
        shell: pwsh
        run: |
          Write-Host "Running build-usb.ps1..."
          .\updater\build-usb.ps1
          Write-Host "=== dist ==="
          dir dist -Recurse -ErrorAction SilentlyContinue

      - name: Upload USB-CapNhat
        uses: actions/upload-artifact@v4
        with:
          name: USB-CapNhat-Full
          path: dist/**
          if-no-files-found: error
