name: Build BatADB v2 - Open Hidden Dev Settings
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create AdbEnabler v2 project
        shell: bash
        run: |
          mkdir -p AdbEnablerV2/app/src/main/java/com/cleantv/adbenabler

          cat > AdbEnablerV2/settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > AdbEnablerV2/build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > AdbEnablerV2/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.cleantv.adbenabler'
            compileSdk 34
            defaultConfig {
              applicationId "com.cleantv.adbenabler.v2"
              minSdk 21
              targetSdk 34
              versionCode 2
              versionName "2.0"
            }
            buildTypes {
              debug { minifyEnabled false }
              release { minifyEnabled false }
            }
          }
          dependencies {}
          EOF

          cat > AdbEnablerV2/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <application android:label="BatADB RS10 v2" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > AdbEnablerV2/app/src/main/java/com/cleantv/adbenabler/MainActivity.java <<'JAVA'
          package com.cleantv.adbenabler;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.*;
          import android.view.*;
          import android.util.Log;

          public class MainActivity extends Activity {
              LinearLayout layout;
              void log(String s) {
                  TextView tv = new TextView(this);
                  tv.setText(s);
                  tv.setTextSize(14);
                  tv.setPadding(20,10,20,10);
                  layout.addView(tv);
                  Log.d("BatADBv2", s);
              }
              void addButton(String text, final Intent intent) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          try {
                              startActivity(intent);
                              log("Da mo: " + text);
                          } catch (Exception e) {
                              log("FAIL mo " + text + ": " + e.getMessage());
                          }
                      }
                  });
                  layout.addView(b);
              }
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ScrollView scroll = new ScrollView(this);
                  layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30,30,30,30);
                  scroll.addView(layout);
                  setContentView(scroll);

                  TextView title = new TextView(this);
                  title.setText("=== Bat ADB RS10 v2 ===\nBam tung nut de mo man hinh an:");
                  title.setTextSize(18);
                  layout.addView(title);

                  // 1. Mo Development Settings goc cua Android
                  Intent i1 = new Intent(android.provider.Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS);
                  addButton("1. Mo Developer Options (goc Android)", i1);

                  // 2. Mo Development Settings qua class name
                  Intent i2 = new Intent();
                  i2.setClassName("com.android.settings", "com.android.settings.DevelopmentSettings");
                  addButton("2. Mo DevelopmentSettings (class)", i2);

                  Intent i3 = new Intent();
                  i3.setClassName("com.android.settings", "com.android.settings.Settings$DevelopmentSettingsActivity");
                  addButton("3. Mo DevelopmentSettingsActivity", i3);

                  // 3. Mo Settings Global
                  Intent i4 = new Intent(android.provider.Settings.ACTION_DEVICE_INFO_SETTINGS);
                  addButton("4. Mo Device Info (de bam 7 lan Build Number)", i4);

                  // 4. Mo Factory Menu cua XGIMI
                  Intent i5 = new Intent();
                  i5.setClassName("com.xgimi.factory", "com.xgimi.factory.FactoryActivity");
                  addButton("5. Mo XGIMI Factory Menu (neu co)", i5);

                  Intent i6 = new Intent();
                  i6.setClassName("com.xgimi.settings", "com.xgimi.settings.SettingsActivity");
                  addButton("6. Mo XGIMI Settings goc", i6);

                  log("\nHuong dan:");
                  log("Bam nut 1, neu mo duoc Developer Options thi bat USB Debugging va Wireless Debugging.");
                  log("Neu nut 1 khong duoc, bam nut 4 roi tim Build Number bam 7 lan.");
                  log("Sau khi bat ADB, mo lai CapNhatMayChieu -> Viet hoa XGIMI.");
              }
          }
          JAVA

          ls -R AdbEnablerV2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        shell: bash
        run: |
          cd AdbEnablerV2
          gradle assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: BatADB-RS10-v2
          path: AdbEnablerV2/app/build/outputs/apk/debug/*.apk
