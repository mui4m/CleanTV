name: Build USB-CapNhat Full (Fixed aapt)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Fix aapt path in xgimi-vi script
        shell: pwsh
        run: |
          $file = "tools/xgimi-vi/build-synsepalum-overlay.ps1"
          Write-Host "Patching $file"
          $content = Get-Content $file -Raw
          Write-Host "Original content snippet:"
          $content | Select-String -Pattern "aapt" | Write-Host

          # Thay dong dinh nghia $bt cung thanh tu dong tim
          $newContent = $content -replace '\$bt\s*=\s*"E:\\buildtools\\android-sdk\\build-tools\\34\.0\.0"', @'
          # Auto-detect aapt path for GitHub Actions
          $sdkRoots = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, "C:\Android\android-sdk", "$env:LOCALAPPDATA\Android\Sdk")
          $bt = $null
          foreach ($root in $sdkRoots) {
            if (-not $root) { continue }
            $candidate = Join-Path $root "build-tools\34.0.0"
            if (Test-Path "$candidate\aapt.exe") { $bt = $candidate; break }
          }
          if (-not $bt) {
            $aapt = Get-ChildItem -Path $env:ANDROID_HOME -Recurse -Filter aapt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($aapt) { $bt = $aapt.DirectoryName }
          }
          if (-not $bt) { $bt = "C:\Android\android-sdk\build-tools\34.0.0" }
          Write-Host "Using aapt from: $bt"
          '@

          # Neu khong match pattern tren, chen them logic tim kiem vao dau file
          if ($newContent -eq $content) {
            Write-Host "Pattern not matched, injecting auto-detect at top"
            $inject = @'
          # --- AUTO-DETECT AAPT FOR GITHUB ACTIONS ---
          $sdkRoots = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, "C:\Android\android-sdk", "$env:LOCALAPPDATA\Android\Sdk")
          $btAuto = $null
          foreach ($root in $sdkRoots) {
            if (-not $root) { continue }
            $candidate = Join-Path $root "build-tools\34.0.0"
            if (Test-Path "$candidate\aapt.exe") { $btAuto = $candidate; break }
          }
          if (-not $btAuto) {
            $aapt = Get-ChildItem -Path $env:ANDROID_HOME -Recurse -Filter aapt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($aapt) { $btAuto = $aapt.DirectoryName }
          }
          if ($btAuto) { $bt = $btAuto; Write-Host "Auto-detected aapt at: $bt" }
          # --- END AUTO-DETECT ---

          '@
            $newContent = $inject + $content
          }

          Set-Content -Path $file -Value $newContent -Encoding UTF8
          Write-Host "Patched file:"
          Get-Content $file | Select-String -Pattern "bt" | Select-Object -First 20 | Write-Host

      - name: Install build-tools
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = "C:\Android\android-sdk" }
          Write-Host "SDK Root: $sdkRoot"
          $sdkmanager = Get-ChildItem -Path $sdkRoot -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sdkmanager) {
            Write-Host "Found sdkmanager: $($sdkmanager.FullName)"
            & $sdkmanager.FullName "build-tools;34.0.0" "platform-tools"
          } else {
            Write-Host "sdkmanager not found, trying via sdkmanager command"
            sdkmanager "build-tools;34.0.0" "platform-tools"
          }
          Get-ChildItem "$sdkRoot\build-tools" -Directory | Write-Host

      - name: Build full USB package
        shell: pwsh
        run: |
          Write-Host "Running build-usb.ps1..."
          try {
            .\updater\build-usb.ps1
          } catch {
            Write-Host "build-usb.ps1 failed at synsepalum step, trying to skip Android 6 overlay..." -ForegroundColor Yellow
            Write-Host $_
            # Patch build-usb.ps1 to not throw
            $buildFile = "updater/build-usb.ps1"
            $content = Get-Content $buildFile -Raw
            $content = $content -replace "throw 'Dung ban dich Cai dat XGIMI Android 6 that bai'", "Write-Host 'Bo qua loi Android 6 - tiep tuc' -ForegroundColor Yellow"
            Set-Content -Path $buildFile -Value $content -Encoding UTF8
            .\updater\build-usb.ps1
          }
          Write-Host "=== dist content ==="
          dir dist -Recurse

      - name: Upload USB-CapNhat
        uses: actions/upload-artifact@v4
        with:
          name: USB-CapNhat-Full
          path: |
            dist/**
          if-no-files-found: error
