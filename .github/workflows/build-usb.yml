name: Build USB-CapNhat Full (Fix parser)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Fix hardcoded paths and parser errors
        shell: pwsh
        run: |
          Write-Host "=== Fixing build-synsepalum-overlay.ps1 ===" -ForegroundColor Green
          $file1 = "tools/xgimi-vi/build-synsepalum-overlay.ps1"
          if (Test-Path $file1) {
            $lines = Get-Content $file1
            $newLines = @()
            foreach ($line in $lines) {
              # Thay tat ca duong dan cung E:\buildtools...
              $line = $line -replace 'E:\\buildtools\\android-sdk\\build-tools\\34\.0\.0', 'C:\Android\android-sdk\build-tools\34.0.0'
              $line = $line -replace 'E:/buildtools/android-sdk/build-tools/34\.0\.0', 'C:/Android/android-sdk/build-tools/34.0.0'
              # Thay dinh nghia $bt = "...34.0.0" thanh auto
              if ($line -match '^\s*\$bt\s*=\s*".*build-tools.*"' -or $line -match '^\s*\$bt\s*=\s*''.*build-tools.*''') {
                $line = '  $bt = "C:\Android\android-sdk\build-tools\34.0.0"'
                $newLines += '  if (-not (Test-Path "$bt\aapt.exe")) {'
                $newLines += '    $aapt = Get-ChildItem -Path $env:ANDROID_HOME -Recurse -Filter aapt.exe -ErrorAction SilentlyContinue | Select-Object -First 1'
                $newLines += '    if ($aapt) { $bt = $aapt.DirectoryName }'
                $newLines += '  }'
                $newLines += '  Write-Host "Using aapt from: $bt"'
              }
              $newLines += $line
            }
            Set-Content -Path $file1 -Value $newLines -Encoding UTF8
            Write-Host "Fixed $file1"
          }

          Write-Host "=== Fixing updater/build-usb.ps1 parser error ===" -ForegroundColor Green
          $file2 = "updater/build-usb.ps1"
          if (Test-Path $file2) {
            $content = Get-Content $file2 -Raw
            
            # 1. Thay throw thanh Write-Host
            $content = $content -replace "throw 'Dung ban dich Cai dat XGIMI Android 6 that bai'", "Write-Host 'Bo qua loi Android 6 - tiep tuc build' -ForegroundColor Yellow"
            
            # 2. Fix dong Copy-Item bi thieu } - thay bang version an toan co kiem tra file ton tai
            # Tim va thay the toan bo dong Copy-Item XgimiSettingsVi-overlay.apk
            $content = $content -replace 'Copy-Item \(Join-Path \$root ''dist\\XgimiSettingsVi-overlay\.apk''\) \(Join-Path \$root ''[^'']+''\)', @'
if (Test-Path (Join-Path $root 'dist\XgimiSettingsVi-overlay.apk')) {
              Copy-Item (Join-Path $root 'dist\XgimiSettingsVi-overlay.apk') (Join-Path $root 'dist\USB-CapNhat\XgimiSettingsVi-overlay.apk') -Force
            } else {
              Write-Host "Skip XgimiSettingsVi-overlay.apk - file not built (not needed for RS10)" -ForegroundColor Yellow
            }
'@

            # Dam bao khong con dong if le loi tu lan patch truoc
            $content = $content -replace 'if \(Test-Path \(Join-Path \$root ''dist\\XgimiSettingsVi-overlay\.apk''\)\) \{ Copy-It.*', ''

            Set-Content -Path $file2 -Value $content -Encoding UTF8
            Write-Host "Fixed $file2 - checking syntax:"
            Get-Content $file2 | Select-Object -First 40 | Write-Host
          }

      - name: Install build-tools
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = "C:\Android\android-sdk" }
          $sdkmanager = Get-ChildItem -Path $sdkRoot -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sdkmanager) {
            & $sdkmanager.FullName "build-tools;34.0.0" "platform-tools"
          } else {
            sdkmanager "build-tools;34.0.0" "platform-tools"
          }

      - name: Build USB package
        shell: pwsh
        run: |
          Write-Host "Running build-usb.ps1..."
          .\updater\build-usb.ps1
          Write-Host "`n=== dist ===" -ForegroundColor Green
          Get-ChildItem dist -Recurse -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: USB-CapNhat-Full
          path: dist/**
          if-no-files-found: error
