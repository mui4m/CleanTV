name: Build CleanTV APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (manual)
        shell: pwsh
        run: |
          # windows-latest already has Android SDK at C:\Android\android-sdk
          $sdkRoot = $env:ANDROID_HOME
          if (-not $sdkRoot) { $sdkRoot = "C:\Android\android-sdk" }
          Write-Host "SDK at $sdkRoot"
          # Accept licenses
          $sdkmanager = "$sdkRoot\cmdline-tools\latest\bin\sdkmanager.bat"
          if (Test-Path $sdkmanager) {
            echo y | & $sdkmanager --licenses
            & $sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          } else {
            # fallback sdkmanager from older location
            $alt = Get-ChildItem -Path $sdkRoot -Recurse -Filter sdkmanager.bat | Select-Object -First 1
            if ($alt) {
              echo y | & $alt.FullName --licenses
              & $alt.FullName "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            }
          }
          Get-ChildItem $sdkRoot -Directory | Write-Host

      - name: Build Launcher APK
        shell: pwsh
        run: |
          cd launcher/app
          ./gradlew.bat assembleDebug --stacktrace
          cd ../..

      - name: Collect APKs
        shell: pwsh
        run: |
          mkdir dist -Force
          Get-ChildItem -Recurse -Filter *.apk | ForEach-Object {
            Write-Host "Found APK: $($_.FullName)"
            Copy-Item $_.FullName dist/ -Force
          }
          dir dist -Recurse
          dir launcher/app/build/outputs -Recurse -ErrorAction SilentlyContinue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-APKs
          path: |
            dist/*.apk
            launcher/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
