name: Build Both APKs Correct
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find all gradle projects
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter build.gradle | Format-Table FullName

      - name: Build Launcher
        shell: pwsh
        run: |
          cd launcher/app
          gradle assembleDebug
          cd ../..
          dir launcher/app/build/outputs/apk/debug -Recurse

      - name: Build Updater (CapNhatMayChieu)
        shell: pwsh
        run: |
          # Updater project is launcher/updater
          if (Test-Path launcher/updater/build.gradle) {
            cd launcher/updater
            gradle assembleDebug
            cd ../..
          } elseif (Test-Path launcher/updater/app/build.gradle) {
            cd launcher/updater/app
            gradle assembleDebug
            cd ../../..
          } else {
            Write-Host "Checking launcher/updater structure"
            dir launcher/updater -Recurse | Format-Table Name, Directory
            # Try build all gradle in launcher/updater
            $files = Get-ChildItem launcher/updater -Recurse -Filter build.gradle
            foreach ($f in $files) {
              Push-Location $f.DirectoryName
              Write-Host "Building in $($f.DirectoryName)"
              gradle assembleDebug
              Pop-Location
            }
          }
          Get-ChildItem -Path launcher/updater -Recurse -Filter *.apk | Format-Table FullName, Length

      - name: Assemble final USB
        shell: pwsh
        run: |
          mkdir dist/USB-CapNhat -Force
          $launcher = Get-ChildItem launcher/app/build/outputs/apk/debug -Filter *.apk | Select-Object -First 1
          $updater = Get-ChildItem launcher/updater -Filter *.apk -Recurse | Select-Object -First 1
          
          if ($launcher) {
            Copy-Item $launcher.FullName dist/USB-CapNhat/launcher.apk -Force
            Copy-Item $launcher.FullName dist/launcher.apk -Force
            Write-Host "Launcher: $($launcher.Length) bytes - $($launcher.FullName)"
          }
          if ($updater) {
            Copy-Item $updater.FullName dist/USB-CapNhat/CapNhatMayChieu.apk -Force
            Copy-Item $updater.FullName dist/CapNhatMayChieu.apk -Force
            Write-Host "Updater: $($updater.Length) bytes - $($updater.FullName)"
          } else {
            Write-Host "Updater not found!" -ForegroundColor Red
            Get-ChildItem -Filter *.apk -Recurse | Format-Table FullName, Length
          }

          if ($launcher -and $updater) {
            $h1 = (Get-FileHash $launcher.FullName -Algorithm MD5).Hash
            $h2 = (Get-FileHash $updater.FullName -Algorithm MD5).Hash
            Write-Host "Launcher MD5: $h1"
            Write-Host "Updater MD5: $h2"
            if ($h1 -eq $h2) { Write-Host "FAIL: 2 file giong nhau!" -ForegroundColor Red } else { Write-Host "OK: 2 file khac nhau" -ForegroundColor Green }
          }

          if (Test-Path tools/xgimi-vi) { Copy-Item tools/xgimi-vi dist/USB-CapNhat/ -Recurse -Force -ErrorAction SilentlyContinue }
          dir dist -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: USB-CapNhat-Fixed-Both
          path: dist/**
