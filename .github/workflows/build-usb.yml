name: Build BatADB APK for XGIMI RS10
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create AdbEnabler project
        shell: bash
        run: |
          mkdir -p AdbEnabler/app/src/main/java/com/cleantv/adbenabler
          
          cat > AdbEnabler/settings.gradle <<'EOF'
          include ':app'
          EOF
          
          cat > AdbEnabler/build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > AdbEnabler/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.cleantv.adbenabler'
            compileSdk 34
            defaultConfig {
              applicationId "com.cleantv.adbenabler"
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release { minifyEnabled false }
              debug { minifyEnabled false }
            }
          }
          dependencies {}
          EOF
          
          cat > AdbEnabler/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.WRITE_GLOBAL_SETTINGS"/>
              <application
                  android:label="BatADB RS10"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cp /tmp/AdbEnabler.java AdbEnabler/app/src/main/java/com/cleantv/adbenabler/MainActivity.java 2>/dev/null || cp $GITHUB_WORKSPACE/../AdbEnabler.java AdbEnabler/app/src/main/java/com/cleantv/adbenabler/MainActivity.java || echo "Copy failed, creating inline"
          
          # If copy failed, create file directly
          if [ ! -f AdbEnabler/app/src/main/java/com/cleantv/adbenabler/MainActivity.java ]; then
          cat > AdbEnabler/app/src/main/java/com/cleantv/adbenabler/MainActivity.java <<'JAVA'
          package com.cleantv.adbenabler;
          import android.app.Activity;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setPadding(30,30,30,30);
                  StringBuilder log = new StringBuilder();
                  log.append("=== Bat ADB RS10 ===\n");
                  try { Settings.Global.putInt(getContentResolver(), Settings.Global.ADB_ENABLED, 1); log.append("[OK] adb_enabled\n"); } catch (Exception e) { log.append("[FAIL] "+e.getMessage()+"\n"); }
                  try { Settings.Global.putInt(getContentResolver(), "adb_wifi_enabled", 1); log.append("[OK] adb_wifi_enabled\n"); } catch (Exception ex) { log.append("[FAIL] "+ex.getMessage()+"\n"); }
                  try { Settings.Global.putInt(getContentResolver(), "development_settings_enabled", 1); log.append("[OK] dev enabled\n"); } catch (Exception ex) { log.append("[FAIL] "+ex.getMessage()+"\n"); }
                  String[] cmds = {"setprop service.adb.tcp.port 5555","setprop persist.service.adb.enable 1","stop adbd","start adbd"};
                  for (String c : cmds) { try { Runtime.getRuntime().exec(c).waitFor(); log.append("[OK] "+c+"\n"); } catch (Exception e) { log.append("[FAIL] "+c+"\n"); } }
                  log.append("\nXong! Mo lai CapNhatMayChieu.");
                  tv.setText(log.toString());
                  setContentView(tv);
              }
          }
          JAVA
          fi
          
          ls -R AdbEnabler

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        shell: bash
        run: |
          cd AdbEnabler
          gradle assembleDebug --stacktrace
          ls -R app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: BatADB-RS10-APK
          path: AdbEnabler/app/build/outputs/apk/debug/*.apk
